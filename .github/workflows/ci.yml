name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      # Fails when the EF model has changed without a migration (D8). Needs no database.
      - name: Migrations up to date
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/Infrastructure --startup-project src/Api --configuration Release --no-build

      # Integration tests start PostgreSQL with Testcontainers; the hosted runner has Docker.
      # OpenApiDocumentTests fails here if docs/api/openapi.json differs from what the API serves (D12).
      - name: Test
        run: dotnet test -c Release --no-build

      # `dotnet list package --vulnerable` always exits 0, so fail on High or Critical ourselves.
      - name: Vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -qE '\b(High|Critical)\b' vulnerable.txt; then
            echo "::error::High or critical vulnerable NuGet package found"
            exit 1
          fi

  # D12: flag breaking changes to the committed API contract against main (ADR-004 change rules).
  api-contract:
    name: API contract (oasdiff)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Contract on main
        id: base
        run: |
          git fetch --depth=1 origin main
          mkdir -p .oasdiff
          if git show origin/main:docs/api/openapi.json > .oasdiff/openapi-main.json 2>/dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::docs/api/openapi.json is not on main yet; nothing to compare."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # review: false keeps the specs in CI (no upload to oasdiff.com; CLAUDE.md rule 2).
      - name: Breaking changes against main
        if: steps.base.outputs.found == 'true'
        uses: oasdiff/oasdiff-action/breaking@8a211b41745fcecdfa4a86531ffbf08934fb14f6 # v0.1.23
        with:
          base: .oasdiff/openapi-main.json
          revision: docs/api/openapi.json
          fail-on: ERR
          review: 'false'

  web:
    name: Web lint, type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # The client is generated from the committed contract (docs/api/openapi.json) and committed too (Design §18.4).
      - name: Generated API client up to date
        run: |
          npm run generate:api
          if [ -n "$(git status --porcelain -- src/api)" ]; then
            git status --porcelain -- src/api
            echo "::error::web/src/api differs from what orval generates. Run 'npm run generate:api' in web/ and commit the result."
            exit 1
          fi

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      # Translation parity (en / zh-CN) and error-code coverage (AC1.8).
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  # Playwright against the real API and PostgreSQL (Design §18.4). Both sides run on plain HTTP on localhost: the guest
  # page needs no session cookie, and there is no certificate to trust.
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [dotnet, web]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reservations
          POSTGRES_USER: reservations
          POSTGRES_PASSWORD: ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reservations -d reservations"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # CI-only values for a throwaway database and demo session; not secrets (CLAUDE.md rule 11).
      ConnectionStrings__Reservations: Host=localhost;Port=5432;Database=reservations;Username=reservations;Password=ci_only
      Demo__HostPasscode: ci-host-passcode
      Demo__PresenterPasscode: ci-presenter-passcode
      Cors__AllowedOrigins__0: http://localhost:3000
      # Development: migrations and the Golden Dragon seed run at start-up (Database:MigrateOnStartup).
      ASPNETCORE_ENVIRONMENT: Development
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5000
      E2E_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tests/E2E/package-lock.json

      - name: Build API
        run: dotnet build src/Api -c Release

      - name: Start API
        run: |
          nohup dotnet run --project src/Api -c Release --no-build --no-launch-profile --urls http://localhost:5000 > api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5000/health/ready > /dev/null; then echo "API ready"; exit 0; fi
            sleep 2
          done
          echo "::error::The API did not become ready"; cat api.log; exit 1

      - name: Build web (static export)
        working-directory: web
        run: |
          npm ci
          npm run build

      # Plain static file server, like S3 + CloudFront in M12: /book/ must resolve to out/book/index.html.
      - name: Serve web
        run: |
          nohup python3 -m http.server 3000 --directory web/out > web.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/book/ > /dev/null; then echo "Web ready"; exit 0; fi
            sleep 1
          done
          echo "::error::The static site did not start"; cat web.log; exit 1

      - name: Install Playwright
        working-directory: tests/E2E
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Playwright
        working-directory: tests/E2E
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            tests/E2E/playwright-report
            tests/E2E/test-results
          retention-days: 7

      - name: API log on failure
        if: failure()
        run: tail -n 200 api.log || true
